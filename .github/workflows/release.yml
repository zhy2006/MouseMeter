name: Release macOS

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-macos
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read and validate VERSION
        id: version
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must use major.minor.patch format" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION ($version)" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
            label: x64
          - runner: macos-15
            arch: arm64
            label: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      SIGN_IDENTITY: Flick Self-Signed Code Signing
    steps:
      - uses: actions/checkout@v4
      - name: Import Flick signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$CERTIFICATE_BASE64" || -z "$CERTIFICATE_PASSWORD" ]]; then
            echo "Configure MACOS_CERTIFICATE_P12_BASE64 and MACOS_CERTIFICATE_PASSWORD secrets" >&2
            exit 1
          fi
          certificate_path="$RUNNER_TEMP/flick.p12"
          keychain_path="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$CERTIFICATE_PASSWORD" \
            -k "$keychain_path" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain_path" > /dev/null
          security list-keychains -d user -s "$keychain_path"
          # Trust the self-signed Flick certificate on this disposable runner.
          security find-certificate -c "$SIGN_IDENTITY" -p "$keychain_path" > "$RUNNER_TEMP/flick.pem"
          security add-trusted-cert -r trustRoot -p codeSign \
            -k "$keychain_path" "$RUNNER_TEMP/flick.pem"
          rm -f "$certificate_path"
      - name: Build and verify DMG
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          make dmg
          lipo build/MouseMeter.app/Contents/MacOS/MouseMeter -verify_arch "$ARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.label }}
          path: build/MouseMeter-${{ needs.version.outputs.version }}-${{ matrix.label }}.dmg
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Clean up signing credentials
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/signing.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/flick.p12" "$RUNNER_TEMP/flick.pem"

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dmg-*
          path: dist
          merge-multiple: true
      - name: Publish release
        shell: bash
        run: |
          tag="v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            # Allow reruns to recover from a partial upload.
            gh release upload "$tag" dist/*.dmg --clobber
          else
            gh release create "$tag" dist/*.dmg \
              --verify-tag \
              --target "$RELEASE_COMMIT" \
              --title "MouseMeter $VERSION" \
              --generate-notes
          fi
      - name: Delete temporary Actions artifacts after publishing
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100
            });
            for (const artifact of artifacts) {
              if (artifact.name.startsWith('dmg-')) {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id
                });
              }
            }
